<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title_01</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #222;
      color: #fff;
      min-height: 100vh;
    }
    .container {
      margin: 0 20%;
      background: #555;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      display: grid;
      gap: 1.5rem;
    }
    .holder {
      background: #b0b0b0;
      color: #fff;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }
    .holder h1 {
      margin-top: 0;
      font-size: 1.8rem;
      border-bottom: 2px solid rgba(255,255,255,0.2);
      padding-bottom: 0.5rem;
    }
    .holder p {
      line-height: 1.7;
      margin: 1rem 0 0;
    }
    .placeholder {
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="holder">
      <h1>Title_01</h1>
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
    </div>
    <div class="holder placeholder">Placeholder holder 1</div>
    <div class="holder placeholder">Placeholder holder 2</div>
  </div>
</body>
</html>
